  @font-face {
    font-family: "Adobe Garamond Pro";
    font-style: normal;
    font-weight: 400;
    src: url(/assets/fonts/404/ipod/AGaramondPro-Regular.woff2) format("woff2");
    font-display: swap;
  }
  html, body {
    height: 100%;
    margin: 0;
  }
  body {
    display: flex;
    align-items: center;
    justify-content: center;
    background: #fff; /* 与官网 404 页底色一致 */
    overflow: hidden;
  }
  web-music-ipod {
    width: min(46vh, 88vw);
    filter: drop-shadow(0 18px 40px rgba(20, 24, 40, .28));
  }

  <script src="/ipod-cjk.js"></script>
